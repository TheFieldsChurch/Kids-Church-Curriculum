<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mary Quiz &middot; Bible Heroes Week 5</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(160deg, #6a4c93 0%, #8a5fb0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #ffffff;
    width: 100%;
    max-width: 640px;
    border-radius: 22px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.28);
    overflow: hidden;
  }
  .header {
    background: #6a4c93;
    color: #ffffff;
    padding: 26px 30px 22px;
    text-align: center;
  }
  .header .tag {
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 1;
    color: #ffffff;
    margin-bottom: 6px;
  }
  .header h1 {
    font-size: 1.7rem;
    color: #ffffff;
  }
  .progress {
    background: #efe7f6;
    height: 10px;
    width: 100%;
  }
  .progress-bar {
    background: #f5a623;
    height: 100%;
    width: 0%;
    transition: width 0.35s ease;
  }
  .body { padding: 30px; }
  .qcount {
    font-size: 0.85rem;
    color: #8a5fb0;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .question {
    font-size: 1.35rem;
    color: #2c2140;
    font-weight: 700;
    line-height: 1.35;
    margin-bottom: 24px;
  }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    background: #f7f4fb;
    border: 2px solid #e2d6f0;
    border-radius: 14px;
    padding: 16px 18px;
    font-size: 1.08rem;
    color: #33294a;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .option:hover:not(:disabled) {
    border-color: #8a5fb0;
    background: #f0e8f8;
  }
  .option.wrong {
    text-decoration: line-through;
    color: #b0a4c4;
    background: #f1eef6;
    border-color: #e2d6f0;
    cursor: not-allowed;
  }
  .option.correct {
    background: #e6f6ec;
    border-color: #4caf70;
    color: #1e6b3c;
    font-weight: 700;
  }
  .feedback {
    text-align: center;
    font-size: 1.15rem;
    font-weight: 700;
    margin-top: 20px;
    min-height: 28px;
  }
  .feedback.ok { color: #2e9e57; }
  .feedback.no { color: #d9645b; }
  .done { text-align: center; padding: 46px 30px; }
  .done h2 {
    font-size: 2.4rem;
    color: #6a4c93;
    margin-bottom: 14px;
  }
  .done p {
    font-size: 1.15rem;
    color: #5a4a72;
    margin-bottom: 30px;
  }
  .star { font-size: 3rem; margin-bottom: 10px; }
  .play-again {
    background: #f5a623;
    color: #ffffff;
    border: none;
    border-radius: 14px;
    padding: 15px 34px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .play-again:hover { background: #e0951a; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="tag">Bible Heroes &middot; Week 5</div>
      <h1>Mary: God's Surprising Plan</h1>
    </div>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    <div class="body" id="quizBody"></div>
  </div>

<script>
  const questions = [
    {
      q: "What town did Mary live in?",
      options: ["Nazareth", "Bethlehem", "Jerusalem", "Egypt"],
      answer: 0
    },
    {
      q: "Who appeared to Mary with a message from God?",
      options: ["A king", "An angel", "A shepherd", "A prophet"],
      answer: 1
    },
    {
      q: "How did Mary feel at first when the angel came?",
      options: ["Excited", "Sleepy", "Terrified", "Angry"],
      answer: 2
    },
    {
      q: "Did Mary understand God's plan straight away?",
      options: ["Yes, she understood everything", "No, but she trusted God anyway", "No, so she said no", "No, and she ran away"],
      answer: 1
    },
    {
      q: "How many days did Mary and Joseph search before they found Jesus?",
      options: ["One", "Three", "Seven", "Ten"],
      answer: 1
    },
    {
      q: "Where did Mary and Joseph find Jesus?",
      options: ["At the market", "By the river", "At the temple", "At a friend's house"],
      answer: 2
    },
    {
      q: "What was Jesus' first miracle, which Mary was there for?",
      options: ["He walked on water", "He fed five thousand people", "He healed a blind man", "He turned water into wine at a wedding"],
      answer: 3
    },
    {
      q: "Why did Jesus die on the cross?",
      options: ["He took the punishment for our sins", "He was too tired", "He had done something wrong", "Nobody knows"],
      answer: 0
    },
    {
      q: "Who did Mary gather and pray with afterwards?",
      options: ["The Roman soldiers", "The disciples and Jesus' brothers", "The teachers at the temple", "Nobody, she prayed alone"],
      answer: 1
    },
    {
      q: "Who did they receive when they prayed together?",
      options: ["A letter", "A gift of gold", "The Holy Spirit", "A new king"],
      answer: 2
    }
  ];

  let current = 0;
  const body = document.getElementById('quizBody');
  const progressBar = document.getElementById('progressBar');

  function renderQuestion() {
    const item = questions[current];
    progressBar.style.width = (current / questions.length * 100) + "%";

    let optionsHtml = "";
    item.options.forEach((opt, i) => {
      optionsHtml += `<button class="option" onclick="choose(${i}, this)">${opt}</button>`;
    });

    body.innerHTML = `
      <div class="qcount">Question ${current + 1} of ${questions.length}</div>
      <div class="question">${item.q}</div>
      <div class="options">${optionsHtml}</div>
      <div class="feedback" id="feedback"></div>
    `;
  }

  function choose(index, btn) {
    const item = questions[current];
    const feedback = document.getElementById('feedback');

    if (index === item.answer) {
      btn.classList.add('correct');
      feedback.textContent = "Correct!";
      feedback.className = "feedback ok";
      document.querySelectorAll('.option').forEach(b => b.disabled = true);
      setTimeout(() => {
        current++;
        if (current < questions.length) {
          renderQuestion();
        } else {
          showDone();
        }
      }, 850);
    } else {
      btn.classList.add('wrong');
      btn.disabled = true;
      feedback.textContent = "Try again!";
      feedback.className = "feedback no";
    }
  }

  function showDone() {
    progressBar.style.width = "100%";
    body.innerHTML = `
      <div class="done">
        <div class="star">&#11088;</div>
        <h2>Well Done!!</h2>
        <p>You finished the Mary quiz!</p>
        <button class="play-again" onclick="restart()">Play Again</button>
      </div>
    `;
  }

  function restart() {
    current = 0;
    renderQuestion();
  }

  renderQuestion();
</script>
</body>
</html>
